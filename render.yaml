services:
  - type: web
    name: knowra-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set at build time in Render dashboard:
      # VITE_API_URL=https://knowra-api.onrender.com/api
